<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A random joke generator powered by JokeAPI." />
  <title>Shawnovision Joke Generator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --panel: rgba(18, 26, 48, 0.88);
      --panel-border: rgba(123, 156, 255, 0.28);
      --text: #eef3ff;
      --muted: #9eaccd;
      --accent: #8ea7ff;
      --accent-strong: #c7d2ff;
      --success: #7ee2b8;
      --danger: #ff9d9d;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, #172852 0, transparent 34%),
                  radial-gradient(circle at 80% 80%, #31204e 0, transparent 32%), var(--bg);
    }

    body::before {
      position: fixed;
      inset: -30%;
      z-index: -1;
      content: "";
      background-image: linear-gradient(rgba(142, 167, 255, .06) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(142, 167, 255, .06) 1px, transparent 1px);
      background-size: 42px 42px;
      transform: perspective(500px) rotateX(58deg) translateY(15%);
      transform-origin: center bottom;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(24px, 5vw, 52px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .06);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: .98;
      letter-spacing: -.06em;
    }

    .intro {
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .joke-card {
      min-height: 210px;
      display: grid;
      align-content: center;
      gap: 18px;
      margin: 32px 0 24px;
      padding: 28px;
      border: 1px solid rgba(142, 167, 255, .25);
      border-radius: 20px;
      background: rgba(4, 8, 20, .42);
    }

    .category {
      width: fit-content;
      margin: 0;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--accent-strong);
      background: rgba(142, 167, 255, .12);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .joke {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 650;
      line-height: 1.4;
    }

    .delivery {
      margin: 0;
      color: var(--accent-strong);
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .status {
      min-height: 1.5em;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: .9rem;
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      flex: 1 1 180px;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      color: var(--text);
      background: rgba(142, 167, 255, .1);
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(142, 167, 255, .2);
      transform: translateY(-2px);
    }

    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .55; }

    .primary {
      color: #10162a;
      border-color: transparent;
      background: var(--accent);
    }

    footer {
      margin-top: 26px;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    footer a { color: var(--accent-strong); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Shawnovision // comedy node</p>
    <h1>Joke generator</h1>
    <p class="intro">Query the comedy lattice for a fresh joke. The node is powered by an external API, so expect occasional cosmic latency.</p>

    <section class="joke-card" aria-live="polite" aria-atomic="true">
      <p class="category" id="category">Connecting…</p>
      <p class="joke" id="joke">Finding a joke in the data stream…</p>
      <p class="delivery" id="delivery"></p>
    </section>

    <p class="status" id="status" role="status"></p>

    <div class="actions">
      <button class="primary" id="new-joke" type="button">✨ Generate a joke</button>
      <button id="copy-joke" type="button" disabled>Copy to clipboard</button>
    </div>

    <footer>Source: <a href="https://jokeapi.dev/" target="_blank" rel="noreferrer">JokeAPI</a> · Safe-mode enabled</footer>
  </main>

  <script>
    const API_URL = "https://v2.jokeapi.dev/joke/Any?type=single%2Ctwopart&safe-mode";
    const jokeElement = document.querySelector("#joke");
    const deliveryElement = document.querySelector("#delivery");
    const categoryElement = document.querySelector("#category");
    const statusElement = document.querySelector("#status");
    const newJokeButton = document.querySelector("#new-joke");
    const copyButton = document.querySelector("#copy-joke");
    let currentJoke = "";

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = `status ${type}`;
    }

    function renderJoke(data) {
      currentJoke = data.type === "single" ? data.joke : `${data.setup}\n\n${data.delivery}`;
      categoryElement.textContent = data.category || "Random";
      jokeElement.textContent = data.type === "single" ? data.joke : data.setup;
      deliveryElement.textContent = data.type === "twopart" ? data.delivery : "";
      copyButton.disabled = false;
    }

    async function getJoke() {
      newJokeButton.disabled = true;
      copyButton.disabled = true;
      setStatus("Querying the comedy lattice…");
      categoryElement.textContent = "Loading";
      jokeElement.textContent = "A punchline is cohering…";
      deliveryElement.textContent = "";

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const data = await response.json();
        if (data.error) throw new Error(data.message || "The API returned an error.");
        renderJoke(data);
        setStatus("New joke successfully collapsed into reality.", "success");
      } catch (error) {
        currentJoke = "";
        categoryElement.textContent = "Signal lost";
        jokeElement.textContent = "The punchline escaped the observable universe.";
        setStatus(`${error.message} Try again in a moment.`, "error");
      } finally {
        newJokeButton.disabled = false;
      }
    }

    async function copyJoke() {
      if (!currentJoke) return;
      try {
        await navigator.clipboard.writeText(currentJoke);
        setStatus("Joke copied to the clipboard.", "success");
      } catch {
        setStatus("Clipboard access was unavailable. Select the joke manually.", "error");
      }
    }

    newJokeButton.addEventListener("click", getJoke);
    copyButton.addEventListener("click", copyJoke);
    getJoke();
  </script>
</body>
</html>
