<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slip Event — Demo</title>
  <style>
    body { margin:0; overflow:hidden; background:#0b0b0f; color:#fff; font-family: Inter, Arial, sans-serif; }
    #ui { position: absolute; left: 12px; top: 12px; z-index: 10; }
    button { margin: 4px; padding:8px 12px; border-radius:6px; border: none; background:#222; color:#fff; cursor:pointer; }
    #log { position: absolute; right: 12px; top: 12px; width:320px; max-height:60vh; overflow:auto; background: rgba(0,0,0,0.6); padding:12px; border-radius:8px; font-family: monospace; font-size:13px; }
    #overlay { position:absolute; inset:0; pointer-events:none; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="btn-anchor">Anchor</button>
    <button id="btn-follow">Follow</button>
    <button id="btn-drop">Drop Incident Seed</button>
  </div>
  <div id="log">Loading Saint‑Roch log…</div>
  <canvas id="c"></canvas>
  <div id="overlay"></div>
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="ui.js"></script>
</body>
</html>
